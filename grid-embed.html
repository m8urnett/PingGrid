<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PingGrid - Network Subnet Status (Embed)</title>
<style>
  :root {
    --color-frame: #2c2c2c;
    --color-border: #2c2c2c;
    --color-offline: #404e41;
    --color-online: #4d86a2;
    --color-highlight: #e4f9d4;
    --color-slow: #ab7550;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .grid-canvas {
    width: 295px;
    height: 77px;
    background-color: var(--color-frame);
    position: relative;
    border: 1px solid #111111;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .grid-table {
    display: grid;
    grid-template-columns: repeat(2, 146px);
    grid-template-rows: repeat(2, 37px);
    gap: 1px;
    background-color: var(--color-border);
    position: absolute;
    top: 1px;
    left: 3px;
    padding: 1px;
  }
  .cell {
    width: 146px;
    height: 37px;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  .cell:hover {
    outline: 1px solid #ffffff;
    z-index: 10;
    transform: scale(1.3);
    filter: brightness(1.2);
  }
  .cell-joined {
    outline: 1.5px solid #52c41a;
    box-shadow: 0 0 8px #52c41a;
    animation: joinPulse 1.6s infinite ease-in-out;
  }
  @keyframes joinPulse {
    0%, 100% { box-shadow: 0 0 3px #52c41a; }
    50% { box-shadow: 0 0 10px #52c41a, inset 0 0 4px #52c41a; }
  }
  .cell-dropped {
    outline: 1.5px dashed #ff4d4f;
    box-shadow: 0 0 6px rgba(255, 77, 79, 0.7);
    animation: dropBlink 1.6s infinite ease-in-out;
  }
  @keyframes dropBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .cell-changed {
    outline: 1.5px solid #faad14;
    box-shadow: 0 0 6px rgba(250, 173, 20, 0.6);
  }
</style>
</head>
<body>
  <div class="grid-canvas">
    <div class="grid-table">
      <div class="cell" style="background-color: #e4f9d4;"
           data-ip="127.0.0.1" data-status="Fast / Gateway" data-rtt="656.9µs" data-delta=""
           title="127.0.0.1 - Fast / Gateway (656.9µs)"></div>
      <div class="cell" style="background-color: #e4f9d4;"
           data-ip="127.0.0.2" data-status="Fast / Gateway" data-rtt="656.9µs" data-delta=""
           title="127.0.0.2 - Fast / Gateway (656.9µs)"></div>
      <div class="cell" style="background-color: #e4f9d4;"
           data-ip="127.0.0.3" data-status="Fast / Gateway" data-rtt="1.3594ms" data-delta=""
           title="127.0.0.3 - Fast / Gateway (1.3594ms)"></div>
      <div class="cell" style="background-color: #e4f9d4;"
           data-ip="127.0.0.4" data-status="Fast / Gateway" data-rtt="656.9µs" data-delta=""
           title="127.0.0.4 - Fast / Gateway (656.9µs)"></div>
    </div>
  </div>
</body>
</html>
